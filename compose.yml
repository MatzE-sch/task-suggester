services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.task-suggester-api.entrypoints=http"
      - "traefik.http.routers.task-suggester-api.rule=Host(`task-suggester.schu.gg`) && PathPrefix(`/api`)"
      - "traefik.http.middlewares.task-suggester-api-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.task-suggester-api.middlewares=task-suggester-api-https-redirect"
      - "traefik.http.middlewares.task-suggester-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.task-suggester-api-secure.entrypoints=https"
      - "traefik.http.routers.task-suggester-api-secure.rule=Host(`task-suggester.schu.gg`) && PathPrefix(`/api`)"
      - "traefik.http.routers.task-suggester-api-secure.tls=true"
      - "traefik.http.routers.task-suggester-api-secure.tls.certresolver=http"
      - "traefik.http.routers.task-suggester-api-secure.middlewares=task-suggester-api-strip"
      - "traefik.http.routers.task-suggester-api-secure.service=task-suggester-api"
      - "traefik.http.services.task-suggester-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"
    networks:
      - default
      - proxy

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.task-suggester.entrypoints=http"
      - "traefik.http.routers.task-suggester.rule=Host(`task-suggester.schu.gg`)"
      - "traefik.http.middlewares.task-suggester-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.task-suggester.middlewares=task-suggester-https-redirect"
      - "traefik.http.routers.task-suggester-secure.entrypoints=https"
      - "traefik.http.routers.task-suggester-secure.rule=Host(`task-suggester.schu.gg`)"
      - "traefik.http.routers.task-suggester-secure.tls=true"
      - "traefik.http.routers.task-suggester-secure.tls.certresolver=http"
      - "traefik.http.routers.task-suggester-secure.service=task-suggester"
      - "traefik.http.services.task-suggester.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    networks:
      - default
      - proxy

volumes:
  postgres_data:

networks:
  proxy:
    external: true
  default:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: fd00:0133:4567::/48
          gateway: fd00:0133:4567::1
